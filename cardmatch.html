<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🃏 翻牌配对 · 可可巧克力工坊</title>
    <style>
        /* ... 样式保持不变 ... */
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { background: linear-gradient(145deg, #f9e7c2 0%, #f5cba0 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; font-family: 'Segoe UI', 'Quicksand', system-ui, sans-serif; padding: 16px; }
        .game-container { max-width: 580px; width: 100%; background: #fffaf0; border-radius: 48px; box-shadow: 0 20px 35px rgba(100,50,10,0.2); padding: 20px 20px 24px; display: flex; flex-direction: column; max-height: 98vh; }
        .game-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; flex-shrink: 0; }
        .game-title { font-size: 1.3rem; font-weight: bold; color: #5a2e1c; }
        .game-stats { display: flex; gap: 16px; font-size: 0.8rem; font-weight: bold; }
        .game-stats span { color: #7b4a2a; }
        .game-stats .stat-value { color: #c4651e; }
        .reward-display { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; font-weight: bold; color: #6f9e3f; background: #eaf7e0; padding: 2px 12px; border-radius: 20px; border: 1.5px solid #a8d88a; white-space: nowrap; }
        .reward-display .reward-icon { font-size: 0.9rem; }
        .reward-display .reward-amount { color: #2d7a1e; }
        .reward-display .reward-bonus { color: #ff8c00; }
        .reward-display .reward-total { color: #1a6b0e; font-weight: 900; }
        .game-result { text-align: center; margin-bottom: 10px; font-size: 0.85rem; font-weight: bold; min-height: 36px; color: #c4651e; background: #fff8f0; border-radius: 16px; padding: 5px 12px; border: 1px solid #f1dbb2; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
        .card-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px 4px; margin-bottom: 12px; aspect-ratio: 6 / 3.8; max-height: 440px; flex-shrink: 0; }
        .card-item { aspect-ratio: 1 / 1; background: #5a3d2b; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 2.2rem; transition: 0.15s; border: 2px solid #7b5a3d; box-shadow: inset 0 -3px 0 #3d2a1a; overflow: hidden; position: relative; min-height: 0; width: 100%; }
        .card-item:hover { transform: scale(1.03); border-color: #ffb347; }
        .card-item.flipped { background: white; border-color: #6f9e3f; box-shadow: inset 0 -3px 0 #4c7a2a; }
        .card-item.matched { background: #d4edda; border-color: #28a745; box-shadow: inset 0 -3px 0 #1e7e34; opacity: 0.6; cursor: default; }
        .card-item.matched:hover { transform: none; }
        .card-item img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }
        .card-item .card-back { font-size: 2rem; color: #ffefb0; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        .game-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; flex-shrink: 0; padding-top: 4px; }
        .game-actions button { border: none; border-radius: 30px; padding: 8px 22px; font-weight: bold; cursor: pointer; transition: 0.1s; font-size: 0.85rem; }
        .game-actions button:active { transform: scale(0.96); }
        .btn-restart { background: #e7a05e; color: white; }
        .btn-restart:hover { background: #c98f5e; }
        .btn-back { background: #c98f5e; color: white; }
        .btn-back:hover { background: #a05e3a; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: #ffefb0; padding: 8px 20px; border-radius: 40px; font-size: 0.85rem; z-index: 999; pointer-events: none; opacity: 0; transition: opacity 0.3s; }
        .toast.show { opacity: 1; }
        @media (max-width: 520px) { .game-container { padding: 14px 14px 18px; } .card-grid { gap: 2px 3px; max-height: 340px; } .card-item { border-radius: 7px; border-width: 1.5px; } .card-item .card-back { font-size: 1.4rem; } .game-title { font-size: 1rem; } .game-stats { font-size: 0.65rem; gap: 8px; } .game-actions button { padding: 5px 14px; font-size: 0.7rem; } .game-result { font-size: 0.7rem; min-height: 30px; padding: 4px 10px; } .reward-display { font-size: 0.6rem; padding: 1px 8px; } }
        @media (max-width: 400px) { .game-container { padding: 10px 10px 14px; border-radius: 32px; } .card-grid { gap: 2px; max-height: 270px; } .card-item { border-radius: 5px; border-width: 1px; } .card-item .card-back { font-size: 1.1rem; } .game-stats { font-size: 0.55rem; gap: 6px; } .game-title { font-size: 0.85rem; } .game-actions button { padding: 4px 10px; font-size: 0.6rem; } .game-result { font-size: 0.6rem; min-height: 26px; padding: 3px 8px; } .reward-display { font-size: 0.5rem; padding: 1px 6px; } }
    </style>
</head>
<body>
<div class="game-container">
    <div class="game-header">
        <div class="game-title">🃏 翻牌配对</div>
        <div style="display:flex;align-items:center;gap:8px;">
            <div class="reward-display">
                <span class="reward-icon">🫘</span>
                <span>基础</span>
                <span class="reward-amount">+30</span>
                <span class="reward-bonus" id="bonusDisplay">+0</span>
                <span style="color:#aaa;margin:0 2px;">|</span>
                <span style="color:#1a6b0e;font-weight:900;" id="totalRewardDisplay">累计:0</span>
            </div>
            <div class="game-stats">
                <span>⏱️ <span id="matchTimer" class="stat-value">0s</span></span>
                <span>🏆 <span id="matchPairs" class="stat-value">0/9</span></span>
            </div>
        </div>
    </div>

    <div class="game-result" id="matchResult">🃏 点击卡片开始配对</div>
    <div class="card-grid" id="cardGrid"></div>
    <div class="game-actions">
        <button class="btn-restart" id="restartBtn">🔄 重新开始</button>
        <button class="btn-back" id="backBtn">← 返回游戏</button>
    </div>
</div>
<div id="toastMsg" class="toast"></div>

<script>
    var TOTAL_PAIRS = 9;
    var TOTAL_CARDS = 18;

    var state = {
        cards: [], flipped: [], matched: [], lockBoard: false,
        pairsFound: 0, timer: 0, timerInterval: null,
        isPlaying: false, isComplete: false
    };

    var grid = document.getElementById('cardGrid');
    var timerEl = document.getElementById('matchTimer');
    var pairsEl = document.getElementById('matchPairs');
    var resultEl = document.getElementById('matchResult');
    var toastEl = document.getElementById('toastMsg');
    var bonusDisplayEl = document.getElementById('bonusDisplay');
    var totalRewardDisplayEl = document.getElementById('totalRewardDisplay');

    // ===== 小游戏统计（直接读写 localStorage） =====
    function loadMinigameStats() {
        try {
            var saved = localStorage.getItem('minigame_stats');
            if (saved) {
                return JSON.parse(saved);
            }
        } catch(e) {}
        return { totalPlays: 0, bestTime: 0, totalReward: 0 };
    }

    function saveMinigameStats(stats) {
        try {
            localStorage.setItem('minigame_stats', JSON.stringify(stats));
            console.log('💾 已保存 minigameStats:', stats);
        } catch(e) {}
    }

    // 初始化和全局暴露
    window.minigameStats = loadMinigameStats();
    console.log('📊 当前 minigameStats:', window.minigameStats);

    function shuffle(array) {
        for (var i = array.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var temp = array[i]; array[i] = array[j]; array[j] = temp;
        }
        return array;
    }

    function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add('show');
        setTimeout(function() { toastEl.classList.remove('show'); }, 2500);
    }

    function generateCards() {
        var pairs = [];
        for (var i = 1; i <= TOTAL_PAIRS; i++) pairs.push(i, i);
        return shuffle(pairs);
    }

    function renderCards() {
        grid.innerHTML = '';
        state.cards.forEach(function(value, index) {
            var card = document.createElement('div');
            card.className = 'card-item';
            card.dataset.index = index;
            var isMatched = state.matched.includes(index);
            var isFlipped = state.flipped.includes(index);
            if (isMatched) {
                card.classList.add('matched');
                card.innerHTML = '<img src="images/card/' + value + '.jpg" alt="card ' + value + '" onerror="this.style.display=\'none\'; this.parentElement.innerHTML=\'<span class=\\\'card-back\\\'>✅</span>\';">';
            } else if (isFlipped) {
                card.classList.add('flipped');
                card.innerHTML = '<img src="images/card/' + value + '.jpg" alt="card ' + value + '" onerror="this.style.display=\'none\'; this.parentElement.innerHTML=\'<span class=\\\'card-back\\\'>❓</span>\';">';
            } else {
                card.innerHTML = '<span class="card-back">❓</span>';
            }
            card.addEventListener('click', function() {
                handleCardClick(parseInt(this.dataset.index));
            });
            grid.appendChild(card);
        });
    }

    function calculateReward(timerSeconds) {
        var baseReward = 30;
        var bonus = 0;
        if (timerSeconds <= 30) bonus = 10;
        else if (timerSeconds <= 60) bonus = 5;
        return { base: baseReward, bonus: bonus, total: baseReward + bonus };
    }

    function updateRewardDisplay(timerSeconds) {
        var reward = calculateReward(timerSeconds);
        if (bonusDisplayEl) {
            bonusDisplayEl.textContent = '+' + reward.bonus;
            if (reward.bonus > 0) bonusDisplayEl.style.color = '#ff8c00';
            else bonusDisplayEl.style.color = '#999';
        }
        updateTotalRewardDisplay();
        return reward;
    }

    function getTotalRewardFromStorage() {
        try {
            var stored = localStorage.getItem('cardmatch_reward_beans');
            return stored ? parseInt(stored) : 0;
        } catch(e) { return 0; }
    }

    function updateTotalRewardDisplay() {
        if (totalRewardDisplayEl) {
            var total = getTotalRewardFromStorage();
            totalRewardDisplayEl.textContent = '累计:' + total;
        }
    }

    function saveRewardToStorage(totalReward) {
        try {
            var currentTotal = getTotalRewardFromStorage();
            var newTotal = currentTotal + totalReward;
            localStorage.setItem('cardmatch_reward_beans', String(newTotal));
            localStorage.setItem('cardmatch_reward_time', String(Date.now()));
            updateTotalRewardDisplay();
            return newTotal;
        } catch(e) { return 0; }
    }

    function handleCardClick(index) {
        if (state.lockBoard) return;
        if (state.matched.includes(index)) return;
        if (state.flipped.includes(index)) return;
        if (typeof soundCardFlip === 'function') soundCardFlip();
        if (state.flipped.length >= 2) return;
        if (state.isComplete) return;
        if (!state.isPlaying) {
            state.isPlaying = true;
            state.timer = 0;
            state.timerInterval = setInterval(function() {
                state.timer++;
                timerEl.textContent = state.timer + 's';
                updateRewardDisplay(state.timer);
            }, 1000);
        }
        state.flipped.push(index);
        renderCards();
        if (state.flipped.length === 2) {
            state.lockBoard = true;
            var idx1 = state.flipped[0];
            var idx2 = state.flipped[1];
            var val1 = state.cards[idx1];
            var val2 = state.cards[idx2];
            if (val1 === val2) {
                state.matched.push(idx1, idx2);
                state.pairsFound++;
                state.flipped = [];
                if (typeof soundSuccess === 'function') soundSuccess();
                state.lockBoard = false;
                renderCards();
                pairsEl.textContent = state.pairsFound + '/9';
                if (state.pairsFound === TOTAL_PAIRS) {
                    completeGame();
                }
            } else {
                setTimeout(function() {
                    if (typeof soundError === 'function') soundError();
                    state.flipped = [];
                    state.lockBoard = false;
                    renderCards();
                }, 700);
            }
        }
    }

    function completeGame() {
        state.isComplete = true;
        state.isPlaying = false;
        if (state.timerInterval) {
            clearInterval(state.timerInterval);
            state.timerInterval = null;
        }

        var reward = calculateReward(state.timer);
        var totalReward = reward.total;
        var newTotal = saveRewardToStorage(totalReward);

        var bonusText = '';
        if (reward.bonus > 0) {
            bonusText = ' ⭐ 速度奖励 +' + reward.bonus;
        }
        if (bonusDisplayEl) {
            bonusDisplayEl.textContent = '+' + reward.bonus;
            bonusDisplayEl.style.color = '#28a745';
        }
        updateTotalRewardDisplay();

        resultEl.innerHTML = '🎉 全部配对完成！ 本局获得 🫘 ' + totalReward + ' 颗豆子！' + bonusText + ' （累计 ' + newTotal + ' 颗待领取）';
        showToast('🎉 本局获得 ' + totalReward + ' 颗豆子！返回主游戏自动到账');

        // ===== 更新小游戏统计 =====
        var stats = loadMinigameStats();
        stats.totalPlays = (stats.totalPlays || 0) + 1;
        var currentTime = state.timer;
        if (currentTime > 0 && (stats.bestTime === 0 || currentTime < stats.bestTime)) {
            stats.bestTime = currentTime;
            console.log('🏆 新的最佳记录: ' + currentTime + ' 秒');
        }
        saveMinigameStats(stats);
        window.minigameStats = stats;
        console.log('📊 更新后 minigameStats:', window.minigameStats);

        // 触发成就检查
        if (typeof checkAchievements === 'function') {
            setTimeout(function() { checkAchievements(); }, 500);
        }
    }

    function restartGame() {
        if (state.timerInterval) {
            clearInterval(state.timerInterval);
            state.timerInterval = null;
        }
        state.cards = generateCards();
        state.flipped = [];
        state.matched = [];
        state.lockBoard = false;
        state.pairsFound = 0;
        state.timer = 0;
        state.isPlaying = false;
        state.isComplete = false;
        timerEl.textContent = '0s';
        pairsEl.textContent = '0/9';
        resultEl.innerHTML = '🃏 点击卡片开始配对';
        if (bonusDisplayEl) {
            bonusDisplayEl.textContent = '+0';
            bonusDisplayEl.style.color = '#999';
        }
        updateTotalRewardDisplay();
        renderCards();
        showToast('🔄 游戏已重置，点击卡片开始');
    }

    function goBack() {
        if (state.timerInterval) {
            clearInterval(state.timerInterval);
            state.timerInterval = null;
        }
        window.location.href = 'index.html';
    }

    function initGame() {
        state.cards = generateCards();
        state.flipped = [];
        state.matched = [];
        state.lockBoard = false;
        state.pairsFound = 0;
        state.timer = 0;
        state.isPlaying = false;
        state.isComplete = false;
        timerEl.textContent = '0s';
        pairsEl.textContent = '0/9';
        resultEl.innerHTML = '🃏 点击卡片开始配对';
        if (bonusDisplayEl) {
            bonusDisplayEl.textContent = '+0';
            bonusDisplayEl.style.color = '#999';
        }
        updateTotalRewardDisplay();
        renderCards();
        console.log('📊 当前累计奖励: ' + getTotalRewardFromStorage() + ' 豆子');
        console.log('📊 minigameStats 初始状态:', window.minigameStats);
    }

    document.getElementById('restartBtn').addEventListener('click', restartGame);
    document.getElementById('backBtn').addEventListener('click', goBack);
    initGame();
    console.log('🃏 翻牌配对游戏已加载 - 每局完成都会累加奖励并记录统计');
</script>
</body>
</html>
